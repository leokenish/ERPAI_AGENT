<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">0.5배와 1.5배가 섞이면, 전체 ×2는 맞지 않을 수 있습니다</title><desc id="desc">설명용 단가 10,000원 / 휴게 반영 후 시간 / 일반 휴휴 분기 / 시차 B 제외 교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">0.5배와 1.5배가 섞이면, 전체 ×2는 맞지 않을 수 있습니다</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">설명용 단가 10,000원 / 휴게 반영 후 시간 / 일반 휴휴 분기 / 시차 B 제외</text><rect x="48" y="180" width="530" height="270" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="530" height="7" rx="3" fill="#087d73"/><circle cx="78" cy="220" r="16" fill="#087d73"/><text x="72" y="226" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="228" fill="#163345" font-size="24" font-weight="700">토요일 6시간 · 대휴 있음</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">단가 10,000원 × 6시간 × 0.5</text><text x="72" y="304" fill="#586b79" font-size="18" font-weight="400">먼저 받는 휴일분 30,000원</text><text x="72" y="340" fill="#586b79" font-size="18" font-weight="400">미사용 대휴 추가 정산 60,000원</text><rect x="622" y="180" width="530" height="270" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="622" y="180" width="530" height="7" rx="3" fill="#b33d3f"/><circle cx="652" cy="220" r="16" fill="#b33d3f"/><text x="646" y="226" fill="#fff" font-size="17" font-weight="700">2</text><text x="680" y="228" fill="#163345" font-size="24" font-weight="700">일요일 2시간 · 대휴 없음</text><text x="646" y="268" fill="#586b79" font-size="18" font-weight="400">단가 10,000원 × 2시간 × 1.5</text><text x="646" y="304" fill="#586b79" font-size="18" font-weight="400">먼저 받는 휴일분 30,000원</text><text x="646" y="340" fill="#586b79" font-size="18" font-weight="400">추가 대휴 정산 0원</text><rect x="76" y="385" width="32" height="28" rx="5" fill="#087d73" stroke="#087d73"/><rect x="118" y="385" width="32" height="28" rx="5" fill="#087d73" stroke="#087d73"/><rect x="160" y="385" width="32" height="28" rx="5" fill="#087d73" stroke="#087d73"/><rect x="202" y="385" width="32" height="28" rx="5" fill="#087d73" stroke="#087d73"/><rect x="244" y="385" width="32" height="28" rx="5" fill="#087d73" stroke="#087d73"/><rect x="286" y="385" width="32" height="28" rx="5" fill="#087d73" stroke="#087d73"/><rect x="650" y="385" width="32" height="28" rx="5" fill="#b33d3f" stroke="#b33d3f"/><rect x="692" y="385" width="32" height="28" rx="5" fill="#b33d3f" stroke="#b33d3f"/><rect x="48" y="485" width="1104" height="162" rx="18" fill="#e6f3ee" stroke="#d3dfe2"/><text x="74" y="523" fill="#163345" font-size="24" font-weight="700">같은 30,000원이어도 계산 근거는 다릅니다.</text><text x="74" y="566" fill="#b33d3f" font-size="24" font-weight="700">휴일분 합계 60,000원 × 2 = 120,000원</text><text x="74" y="608" fill="#087d73" font-size="24" font-weight="700">추가 정산할 대휴는 토요일 하나 → 60,000원</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</text></svg>