<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">계산기에 뜬 새 숫자가 장부에도 옮겨졌을까요?</title><desc id="desc">입구 구조에 이전 80,000원이 남아 있다는 조건부 예시 교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">계산기에 뜬 새 숫자가 장부에도 옮겨졌을까요?</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">입구 구조에 이전 80,000원이 남아 있다는 조건부 예시</text><rect x="48" y="180" width="330" height="235" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="330" height="7" rx="3" fill="#087d73"/><circle cx="78" cy="220" r="16" fill="#087d73"/><text x="72" y="226" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="228" fill="#163345" font-size="24" font-weight="700">이전 저장 구조</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">8시간 입력 당시</text><text x="72" y="304" fill="#586b79" font-size="18" font-weight="400">JORGEH 80,000원</text><path d="M386 298 h28 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="435" y="180" width="330" height="235" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="435" y="180" width="330" height="7" rx="3" fill="#087d73"/><circle cx="465" cy="220" r="16" fill="#087d73"/><text x="459" y="226" fill="#fff" font-size="17" font-weight="700">2</text><text x="493" y="228" fill="#163345" font-size="24" font-weight="700">현재 계산 결과</text><text x="459" y="268" fill="#586b79" font-size="18" font-weight="400">6시간으로 변경</text><text x="459" y="304" fill="#586b79" font-size="18" font-weight="400">실비 30,000원</text><text x="459" y="340" fill="#586b79" font-size="18" font-weight="400">JORGEH 60,000원</text><path d="M775 298 h26 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="822" y="180" width="330" height="235" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="822" y="180" width="330" height="7" rx="3" fill="#b33d3f"/><circle cx="852" cy="220" r="16" fill="#b33d3f"/><text x="846" y="226" fill="#fff" font-size="17" font-weight="700">3</text><text x="880" y="228" fill="#163345" font-size="24" font-weight="700">복사 목록에 빠지면</text><text x="846" y="268" fill="#586b79" font-size="18" font-weight="400">실비는 30,000원</text><text x="846" y="304" fill="#586b79" font-size="18" font-weight="400">JORGEH는 80,000원</text><rect x="48" y="455" width="1104" height="176" rx="18" fill="#e6f3ee" stroke="#d3dfe2"/><text x="74" y="497" fill="#087d73" font-size="26" font-weight="700">제안: 기존 MOVE 목록에 JORGEH 한 항목 추가</text><text x="74" y="542" fill="#163345" font-size="22" font-weight="400">새 60,000원을 저장 구조에 반영합니다. 정상 새 값 0도 복사합니다.</text><text x="74" y="586" fill="#586b79" font-size="19" font-weight="400">웹 F06에서 이미 새 값을 복사한 경로는 이 80,000원 잔존 예시와 다릅니다.</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</text></svg>