<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">공유 서랍 대신, 이번 계산 종이를 바로 전달합니다</title><desc id="desc">F03-01 / 기존 반환 통로 재사용 / 새 DDIC·함수 인수 없음 교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">공유 서랍 대신, 이번 계산 종이를 바로 전달합니다</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">F03-01 / 기존 반환 통로 재사용 / 새 DDIC·함수 인수 없음</text><rect x="48" y="180" width="530" height="242" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="530" height="7" rx="3" fill="#b33d3f"/><circle cx="78" cy="220" r="16" fill="#b33d3f"/><text x="72" y="226" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="228" fill="#163345" font-size="24" font-weight="700">공유 DB에 임시 보관</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">여러 계산이 사번·날짜 주소로 접근</text><text x="72" y="304" fill="#586b79" font-size="18" font-weight="400">이전 계산값과 현재 계산값의 구분 필요</text><text x="72" y="340" fill="#586b79" font-size="18" font-weight="400">CLEAR/REFRESH로 DB 행은 삭제되지</text><text x="72" y="368" fill="#586b79" font-size="18" font-weight="400">않음</text><rect x="622" y="180" width="530" height="242" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="622" y="180" width="530" height="7" rx="3" fill="#087d73"/><circle cx="652" cy="220" r="16" fill="#087d73"/><text x="646" y="226" fill="#fff" font-size="17" font-weight="700">2</text><text x="680" y="228" fill="#163345" font-size="24" font-weight="700">이번 호출의 작업 목록</text><text x="646" y="268" fill="#586b79" font-size="18" font-weight="400">SAVE가 현재 입력으로 GET_DATA를 호출</text><text x="646" y="304" fill="#586b79" font-size="18" font-weight="400">기존 전체·상세 반환값을 그대로 받음</text><text x="646" y="340" fill="#586b79" font-size="18" font-weight="400">호출 시작에 상세와 누계를 초기화</text><rect x="48" y="465" width="1104" height="164" rx="18" fill="#e6f3ee" stroke="#d3dfe2"/><text x="74" y="510" fill="#087d73" font-size="30" font-weight="700">새로운 메모리 캐시를 만든 것이 아닙니다.</text><text x="74" y="554" fill="#163345" font-size="23" font-weight="400">계산 함수가 돌려주는 기존 구조·내부 테이블을 활용합니다.</text><text x="74" y="596" fill="#163345" font-size="23" font-weight="400">최종 정산금액은 여전히 ZTHRBS01에 저장합니다.</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</text></svg>