<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">토8 → 일6 → 토2 : 세 줄이 세 날짜는 아닙니다</title><desc id="desc">원래 토10 + 일6 / D·T의 해당 분할 조건 가정 / 일요일 행도 상세에 포함된 경우 교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">토8 → 일6 → 토2 : 세 줄이 세 날짜는 아닙니다</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">원래 토10 + 일6 / D·T의 해당 분할 조건 가정 / 일요일 행도 상세에 포함된 경우</text><rect x="48" y="180" width="344" height="194" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="344" height="7" rx="3" fill="#087d73"/><circle cx="78" cy="220" r="16" fill="#087d73"/><text x="72" y="226" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="228" fill="#163345" font-size="24" font-weight="700">토요일 8시간</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">계산된 정산 기여분</text><text x="72" y="296" fill="#586b79" font-size="18" font-weight="400">80,000원</text><rect x="74" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="106" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="138" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="170" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="202" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="234" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="266" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="298" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><path d="M398 268 h24 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="428" y="180" width="344" height="194" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="428" y="180" width="344" height="7" rx="3" fill="#087d73"/><circle cx="458" cy="220" r="16" fill="#087d73"/><text x="452" y="226" fill="#fff" font-size="17" font-weight="700">2</text><text x="486" y="228" fill="#163345" font-size="24" font-weight="700">일요일 6시간</text><text x="452" y="268" fill="#586b79" font-size="18" font-weight="400">계산된 정산 기여분</text><text x="452" y="296" fill="#586b79" font-size="18" font-weight="400">60,000원</text><rect x="454" y="313" width="23" height="25" rx="4" fill="#b68039" stroke="#d3dfe2"/><rect x="486" y="313" width="23" height="25" rx="4" fill="#b68039" stroke="#d3dfe2"/><rect x="518" y="313" width="23" height="25" rx="4" fill="#b68039" stroke="#d3dfe2"/><rect x="550" y="313" width="23" height="25" rx="4" fill="#b68039" stroke="#d3dfe2"/><rect x="582" y="313" width="23" height="25" rx="4" fill="#b68039" stroke="#d3dfe2"/><rect x="614" y="313" width="23" height="25" rx="4" fill="#b68039" stroke="#d3dfe2"/><path d="M778 268 h24 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="808" y="180" width="344" height="194" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="808" y="180" width="344" height="7" rx="3" fill="#087d73"/><circle cx="838" cy="220" r="16" fill="#087d73"/><text x="832" y="226" fill="#fff" font-size="17" font-weight="700">3</text><text x="866" y="228" fill="#163345" font-size="24" font-weight="700">토요일 2시간</text><text x="832" y="268" fill="#586b79" font-size="18" font-weight="400">계산된 정산 기여분</text><text x="832" y="296" fill="#586b79" font-size="18" font-weight="400">20,000원</text><rect x="834" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="866" y="313" width="23" height="25" rx="4" fill="#087d73" stroke="#d3dfe2"/><rect x="48" y="412" width="530" height="240" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="412" width="530" height="7" rx="3" fill="#b33d3f"/><text x="72" y="456" fill="#163345" font-size="24" font-weight="700">기존 중간 처리의 위험</text><text x="72" y="500" fill="#586b79" font-size="18" font-weight="400">날짜 묶음: 토 / 일 / 토 → 3묶음</text><text x="72" y="536" fill="#586b79" font-size="18" font-weight="400">임시 DB 토요일: 80,000 →</text><text x="72" y="564" fill="#586b79" font-size="18" font-weight="400">20,000원</text><text x="72" y="600" fill="#586b79" font-size="18" font-weight="400">이 표는 최종 BS01 오류액을 확정하지</text><text x="72" y="628" fill="#586b79" font-size="18" font-weight="400">않습니다.</text><rect x="622" y="412" width="530" height="240" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="622" y="412" width="530" height="7" rx="3" fill="#087d73"/><text x="646" y="456" fill="#163345" font-size="24" font-weight="700">제안: 날짜는 2개, 대휴는 따로</text><text x="646" y="500" fill="#586b79" font-size="18" font-weight="400">토요일: 80,000 + 20,000 =</text><text x="646" y="528" fill="#586b79" font-size="18" font-weight="400">100,000원</text><text x="646" y="564" fill="#586b79" font-size="18" font-weight="400">일요일 정산액: 60,000원 / 대휴 2개</text><text x="646" y="600" fill="#586b79" font-size="18" font-weight="400">시간 분할은 유지하고, 날짜별 금액을 더합니다.</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</text></svg>