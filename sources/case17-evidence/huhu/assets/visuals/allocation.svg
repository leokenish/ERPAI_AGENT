<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">두 날짜의 금액을 대휴 하나에 모을 때도 있습니다</title><desc id="desc">설명용 단가 10,000원 / 일반 휴휴 계산 결과의 전달 원칙 교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">두 날짜의 금액을 대휴 하나에 모을 때도 있습니다</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">설명용 단가 10,000원 / 일반 휴휴 계산 결과의 전달 원칙</text><rect x="48" y="180" width="530" height="236" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="530" height="7" rx="3" fill="#087d73"/><circle cx="78" cy="220" r="16" fill="#087d73"/><text x="72" y="226" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="228" fill="#163345" font-size="24" font-weight="700">토3 + 일2 → 대휴 하나</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">토요일 기여분 30,000원</text><text x="72" y="304" fill="#586b79" font-size="18" font-weight="400">일요일 기여분 20,000원</text><text x="72" y="340" fill="#586b79" font-size="18" font-weight="400">두 기여분 50,000원을 시작일 대휴에 귀속</text><rect x="622" y="180" width="530" height="236" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="622" y="180" width="530" height="7" rx="3" fill="#087d73"/><circle cx="652" cy="220" r="16" fill="#087d73"/><text x="646" y="226" fill="#fff" font-size="17" font-weight="700">2</text><text x="680" y="228" fill="#163345" font-size="24" font-weight="700">토6 + 일6 → 대휴 둘</text><text x="646" y="268" fill="#586b79" font-size="18" font-weight="400">토요일 대휴에 60,000원</text><text x="646" y="304" fill="#586b79" font-size="18" font-weight="400">일요일 대휴에 60,000원</text><text x="646" y="340" fill="#586b79" font-size="18" font-weight="400">전체 120,000원을 양쪽에 반복 복사하지</text><text x="646" y="368" fill="#586b79" font-size="18" font-weight="400">않음</text><rect x="48" y="456" width="1104" height="174" rx="18" fill="#e6f3ee" stroke="#d3dfe2"/><text x="74" y="500" fill="#087d73" font-size="29" font-weight="700">날짜 수와 대휴 개수는 다릅니다.</text><text x="74" y="547" fill="#163345" font-size="22" font-weight="400">양일 계산 결과를 보관 → 하루별 F05 재계산 → 해당 대휴의 JORGEH 최종 설정</text><text x="74" y="590" fill="#586b79" font-size="19" font-weight="400">3+2의 최종 대휴 표시·발생일·실비는 F05까지 포함한 SAP 검증이 남아 있습니다.</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</text></svg>