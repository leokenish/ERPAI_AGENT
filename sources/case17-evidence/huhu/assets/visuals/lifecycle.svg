<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">‘삭제 코드가 있다’와 ‘매 계산 후 삭제된다’는 다릅니다</title><desc id="desc">이전 DB 쓰기가 다음 요청까지 유지된다는 전제의 사고 시나리오 화면 요청 사이 COMMIT/ROLLBACK과 실제 잔존 여부는 SAP 실행 확인이 필요합니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">‘삭제 코드가 있다’와 ‘매 계산 후 삭제된다’는 다릅니다</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">이전 DB 쓰기가 다음 요청까지 유지된다는 전제의 사고 시나리오</text><rect x="48" y="180" width="530" height="208" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="530" height="7" rx="3" fill="#b68039"/><text x="72" y="224" fill="#163345" font-size="24" font-weight="700">생각했던 흐름</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">계산 → 임시 저장 → 즉시 읽기 → 삭제</text><text x="72" y="304" fill="#586b79" font-size="18" font-weight="400">계산을 끝내면 임시 기록도 사라진다고 기대</text><rect x="622" y="180" width="530" height="208" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="622" y="180" width="530" height="7" rx="3" fill="#087d73"/><text x="646" y="224" fill="#163345" font-size="24" font-weight="700">확인한 코드의 흐름</text><text x="646" y="268" fill="#586b79" font-size="18" font-weight="400">화면 계산에서도 임시 DB에 쓸 수 있음</text><text x="646" y="304" fill="#586b79" font-size="18" font-weight="400">읽기·삭제는 SAVE의 특정 분기에 있음</text><rect x="48" y="430" width="258" height="200" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="430" width="258" height="7" rx="3" fill="#087d73"/><circle cx="78" cy="470" r="16" fill="#087d73"/><text x="72" y="476" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="478" fill="#163345" font-size="24" font-weight="700">휴휴로 화면 계산</text><text x="72" y="518" fill="#586b79" font-size="18" font-weight="400">토·일 금액 기록</text><path d="M312 531 h14 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="330" y="430" width="258" height="200" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="330" y="430" width="258" height="7" rx="3" fill="#087d73"/><circle cx="360" cy="470" r="16" fill="#087d73"/><text x="354" y="476" fill="#fff" font-size="17" font-weight="700">2</text><text x="388" y="478" fill="#163345" font-size="24" font-weight="700">익일 해제</text><text x="354" y="518" fill="#586b79" font-size="18" font-weight="400">새 임시 기록 건너뜀</text><text x="354" y="554" fill="#586b79" font-size="18" font-weight="400">이전 행 정리도 없음</text><path d="M594 531 h14 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="612" y="430" width="258" height="200" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="612" y="430" width="258" height="7" rx="3" fill="#b33d3f"/><circle cx="642" cy="470" r="16" fill="#b33d3f"/><text x="636" y="476" fill="#fff" font-size="17" font-weight="700">3</text><text x="670" y="478" fill="#163345" font-size="24" font-weight="700">저장 단계 조회</text><text x="636" y="518" fill="#586b79" font-size="18" font-weight="400">같은 사번·날짜의</text><text x="636" y="554" fill="#586b79" font-size="18" font-weight="400">이전 값이 읽힐 수</text><text x="636" y="582" fill="#586b79" font-size="18" font-weight="400">있음</text><path d="M876 531 h14 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="894" y="430" width="258" height="200" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="894" y="430" width="258" height="7" rx="3" fill="#b33d3f"/><circle cx="924" cy="470" r="16" fill="#b33d3f"/><text x="918" y="476" fill="#fff" font-size="17" font-weight="700">4</text><text x="952" y="478" fill="#163345" font-size="24" font-weight="700">읽은 뒤 삭제</text><text x="918" y="518" fill="#586b79" font-size="18" font-weight="400">행은 없어져도</text><text x="918" y="554" fill="#586b79" font-size="18" font-weight="400">JORGEH에는 이미</text><text x="918" y="582" fill="#586b79" font-size="18" font-weight="400">반영</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">화면 요청 사이 COMMIT/ROLLBACK과 실제 잔존 여부는 SAP 실행 확인이 필요합니다.</text></svg>