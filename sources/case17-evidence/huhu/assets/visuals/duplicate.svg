<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">같은 영수증 두 장과, 서로 다른 영수증 두 장을 구별합니다</title><desc id="desc">F03-03 / 중복 APPEND 방지 + 전체 금액 합산 교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">같은 영수증 두 장과, 서로 다른 영수증 두 장을 구별합니다</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">F03-03 / 중복 APPEND 방지 + 전체 금액 합산</text><rect x="48" y="180" width="530" height="244" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="530" height="7" rx="3" fill="#b33d3f"/><circle cx="78" cy="220" r="16" fill="#b33d3f"/><text x="72" y="226" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="228" fill="#163345" font-size="24" font-weight="700">같은 행이 두 조건에 모두 해당</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">대휴X 조건 → 영수증 A 추가</text><text x="72" y="304" fill="#586b79" font-size="18" font-weight="400">특근 상세 조건 → 같은 영수증 A 또 추가</text><text x="72" y="340" fill="#586b79" font-size="18" font-weight="400">무조건 더하면 A를 두 번 셀 수 있음</text><rect x="622" y="180" width="530" height="244" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="622" y="180" width="530" height="7" rx="3" fill="#087d73"/><circle cx="652" cy="220" r="16" fill="#087d73"/><text x="646" y="226" fill="#fff" font-size="17" font-weight="700">2</text><text x="680" y="228" fill="#163345" font-size="24" font-weight="700">OR 조건으로 한 번만 추가</text><text x="646" y="268" fill="#586b79" font-size="18" font-weight="400">대휴X 또는 특근 상세이면 A 한 번 추가</text><text x="646" y="304" fill="#586b79" font-size="18" font-weight="400">토8의 A와 토2의 B는 서로 다른 원행</text><text x="646" y="340" fill="#586b79" font-size="18" font-weight="400">A와 B는 둘 다 보존하여 더함</text><rect x="48" y="465" width="1104" height="164" rx="18" fill="#e6f3ee" stroke="#d3dfe2"/><text x="74" y="510" fill="#087d73" font-size="30" font-weight="700">중복 복사본 제거 ≠ 시간 구간 삭제</text><text x="74" y="556" fill="#163345" font-size="21" font-weight="400">전체 J 합계는 원래 계산 행에서 한 번씩, 날짜별 금액은 정리된 상세에서 합산합니다.</text><text x="74" y="596" fill="#586b79" font-size="19" font-weight="400">상세에서 제외된 날짜의 기여분이 있을 수 있어 전체 합계도 별도로 보존합니다.</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</text></svg>