<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">계산 실패를 정상 금액으로 저장하지 않도록</title><desc id="desc">SAVE-01 / 첫 계산의 기존 오류 반환 확인 교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><rect width="1200" height="760" fill="#f3f6f3"/><text x="48" y="48" fill="#087d73" font-size="16" font-weight="700">ZHR5  /  AI 에이전트 활용 사례</text><text x="48" y="98" fill="#163345" font-size="34" font-weight="800">계산 실패를 정상 금액으로 저장하지 않도록</text><text x="48" y="137" fill="#586b79" font-size="19" font-weight="400">SAVE-01 / 첫 계산의 기존 오류 반환 확인</text><rect x="48" y="180" width="330" height="240" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="48" y="180" width="330" height="7" rx="3" fill="#b33d3f"/><circle cx="78" cy="220" r="16" fill="#b33d3f"/><text x="72" y="226" fill="#fff" font-size="17" font-weight="700">1</text><text x="106" y="228" fill="#163345" font-size="24" font-weight="700">첫 계산 호출</text><text x="72" y="268" fill="#586b79" font-size="18" font-weight="400">GET_DATA</text><text x="72" y="304" fill="#586b79" font-size="18" font-weight="400">오류 코드 E 반환</text><path d="M388 300 h32 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="435" y="180" width="330" height="240" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="435" y="180" width="330" height="7" rx="3" fill="#087d73"/><circle cx="465" cy="220" r="16" fill="#087d73"/><text x="459" y="226" fill="#fff" font-size="17" font-weight="700">2</text><text x="493" y="228" fill="#163345" font-size="24" font-weight="700">기존 E 코드 전달</text><text x="459" y="268" fill="#586b79" font-size="18" font-weight="400">E_CODE / E_TEXT</text><text x="459" y="304" fill="#586b79" font-size="18" font-weight="400">기존 문구를 호출자에게 반환</text><path d="M777 300 h28 m-10 -7 10 7 -10 7" fill="none" stroke="#7e939f" stroke-width="3"/><rect x="822" y="180" width="330" height="240" rx="18" fill="#ffffff" stroke="#d3dfe2"/><rect x="822" y="180" width="330" height="7" rx="3" fill="#087d73"/><circle cx="852" cy="220" r="16" fill="#087d73"/><text x="846" y="226" fill="#fff" font-size="17" font-weight="700">3</text><text x="880" y="228" fill="#163345" font-size="24" font-weight="700">저장 전 반환</text><text x="846" y="268" fill="#586b79" font-size="18" font-weight="400">RETURN</text><text x="846" y="304" fill="#586b79" font-size="18" font-weight="400">실패 결과를 새 금액으로</text><text x="846" y="332" fill="#586b79" font-size="18" font-weight="400">저장하지 않음</text><rect x="48" y="463" width="1104" height="166" rx="18" fill="#fff3da" stroke="#d3dfe2"/><text x="74" y="506" fill="#163345" font-size="27" font-weight="700">사용자의 오해로 발생한 버그라고 붙이지 않습니다.</text><text x="74" y="550" fill="#163345" font-size="22" font-weight="400">제안 작성 과정에서 추가한 보호 조건입니다. 새 메시지·팝업은 없습니다.</text><text x="74" y="592" fill="#586b79" font-size="21" font-weight="400">F05 내부 재계산 오류 전달까지 해결했다는 뜻은 아닙니다.</text><path d="M48 699 H1152" stroke="#d3dfe2"/><text x="48" y="730" fill="#586b79" font-size="16" font-weight="400">교육용 조건부 예시 · 실제 SAP 실행 결과가 아닙니다.</text></svg>