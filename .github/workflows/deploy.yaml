name: Deploy Static Site to GitHub Pages

on:
  # main 브랜치에 코드가 푸시될 때 자동 실행
  push:
    branches: ["main"] # 본인의 기본 브랜치가 master라면 master로 변경

  # GitHub 웹사이트 Actions 탭에서 수동으로도 실행 가능하도록 설정
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 중복 배포 방지 설정
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 레포지토리 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. GitHub Pages 환경 설정
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. 프로젝트 전체 파일 아티팩트로 압축 (HTML, CSS, JS, MD 파일 모두 포함)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 4. GitHub Pages에 최종 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4